name: Copy Vimeo thumbnails
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/thumbs.yml]
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every Vimeo thumbnail used by the site into thumbs/<key>.jpg
        run: |
          mkdir -p thumbs
          python3 - <<'PY'
          import re, urllib.request, os
          s=open("index.html").read()
          for k,u in re.findall(r'\{k:"([^"]+)"[^}]*?img:"(https://i\.vimeocdn\.com/[^"]+)"', s):
              p=f"thumbs/{k}.jpg"
              req=urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"})
              data=urllib.request.urlopen(req, timeout=30).read()
              if not os.path.exists(p) or open(p,"rb").read()!=data:
                  open(p,"wb").write(data); print("updated",p)
          PY
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add thumbs
          git diff --cached --quiet || (git commit -m "Copy Vimeo thumbnails into thumbs/" && git push)
